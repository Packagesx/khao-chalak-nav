services:
  db:
    image: postgis/postgis:16-3.4
    container_name: khaochalak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-khaochalak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khaochalak}
      POSTGRES_DB: ${POSTGRES_DB:-khaochalak}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-khaochalak}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: khaochalak-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-khaochalak}:${POSTGRES_PASSWORD:-khaochalak}@db:5432/${POSTGRES_DB:-khaochalak}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
    container_name: khaochalak-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
